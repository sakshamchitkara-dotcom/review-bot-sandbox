name: review-bot
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sakshamchitkara-dotcom/review-bot@main
        with:
          post: "true"          # sandbox: post the review so it can be inspected
          upload-sarif: "true"  # and send findings to code scanning
          fail-on: ""
