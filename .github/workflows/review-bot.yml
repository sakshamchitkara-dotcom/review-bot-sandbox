name: review-bot
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sakshamchitkara-dotcom/review-bot@main
        with:
          post: "true"      # sandbox: post the review so it can be inspected
          fail-on: ""
